name: ☑️ dependency review
run-name: check `${{ github.head_ref }}`'s dependencies

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency_review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
